<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BACKTRACKING — Cấu trúc Dữ liệu & Giải thuật</title>
<style>
:root{
  --bg:#F4EFE6; --bg2:#E7F1EF; --paper:#FFF9EE; --ink:#17333A; --ink2:#52666B;
  --navy:#173F4A; --navy2:#0C2E38; --cyan:#147D92; --cyan2:#22B8CF;
  --purple:#F47C5C; --purple2:#FDB39E; --green:#17804A; --green2:#55D98A;
  --red:#D84A4A; --red2:#F28B7B; --amber:#C48A16; --muted:#6E7D80;
  --line:#D7DDD8; --shadow:0 24px 70px rgba(34,64,74,.12); --r:28px;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,sans-serif}
body{letter-spacing:-.01em}
button{font:inherit}
.deck{position:relative;width:100vw;height:100vh;overflow:hidden}
.slide{position:absolute;inset:0;display:none;padding:48px 70px 62px;overflow:hidden;background:var(--bg);color:var(--ink)}
.slide.active{display:block;animation:pageIn .85s cubic-bezier(.2,.8,.2,1) both}
.slide.dark{background:linear-gradient(135deg,#174343,#0C2F2F);color:#F7F5ED}
.slide.soft{background:linear-gradient(135deg,#FFF8ED,#EAF3F1)}
.slide.blue{background:linear-gradient(135deg,#E7F1F6,#FFF8ED)}
.slide.lav{background:linear-gradient(135deg,#FFF1E7,#F6F0E8)}
@keyframes pageIn{from{opacity:0;transform:translateY(12px) scale(.995)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes dash{to{stroke-dashoffset:-180}}
@keyframes pulseBorder{0%,100%{box-shadow:0 0 0 0 rgba(8,145,178,0)}50%{box-shadow:0 0 0 8px rgba(8,145,178,.06),0 0 38px rgba(8,145,178,.16)}}
@keyframes scan{0%{transform:translateX(-110%);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(110%);opacity:0}}
@keyframes write{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}

h1,h2,h3,p{margin:0} h1{font-size:clamp(48px,6vw,88px);line-height:.94;letter-spacing:-.065em} h2{font-size:clamp(34px,4.2vw,60px);line-height:1.02;letter-spacing:-.045em} h3{font-size:22px}
p,.body{font-size:18px;line-height:1.55;color:var(--ink2)}
.dark p,.dark .body{color:#D6E8E2}.muted{color:var(--muted)}.dark .muted{color:#B7D0C8}
.kicker{font-size:13px;font-weight:900;letter-spacing:.17em;text-transform:uppercase;color:var(--cyan);margin-bottom:12px}.dark .kicker{color:var(--cyan2)}
.accent{color:var(--cyan)}.purple{color:var(--purple)}.green{color:var(--green)}.red{color:var(--red)}
.big-num{display:none!important}
.header{position:relative;z-index:3;display:flex;align-items:flex-start;justify-content:space-between;gap:25px;margin-bottom:28px}.header .right{font-size:13px;font-weight:800;color:var(--muted)}.dark .header .right{color:#B0CBC2}
.grid2{display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.panel{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}.dark .panel{background:rgba(12,25,43,.68);border-color:rgba(164,188,215,.16);box-shadow:0 24px 70px rgba(0,0,0,.18)}
.card-title{font-size:19px;font-weight:900;margin-bottom:8px}.card-body{font-size:15px;line-height:1.55;color:#55667d}.dark .card-body{color:#C9DCD5}
.note{border-left:3px solid var(--cyan);padding:0 0 0 14px;margin-top:18px;color:#58697e;font-size:15px;line-height:1.55}.dark .note{color:#CADDD6}
.pill{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid #d9e5f1;background:#FFF7EA;border-radius:999px;font-size:12px;font-weight:900;color:#47625F}.dark .pill{background:rgba(255,255,255,.06);border-color:rgba(164,188,215,.18);color:#D7F4EE}
.dot{width:9px;height:9px;border-radius:50%;background:var(--cyan);box-shadow:0 0 18px rgba(8,145,178,.55)}
.tag{display:inline-flex;padding:6px 9px;border-radius:9px;background:#E8F5F1;color:#245B57;font-size:11px;font-weight:900;letter-spacing:.05em}.dark .tag{background:rgba(255,255,255,.08);color:#c8ddf3}


/* Final palette polish */
.slide:not(.dark) .panel{background:rgba(255,249,238,.94)}
.slide:not(.dark) .step{background:rgba(255,247,234,.96)}
.slide:not(.dark) .metric{background:rgba(255,249,238,.96)}
.board-label{color:#53676A}
.qpiece::after{content:"";position:absolute;inset:25%;border-radius:50%;background:radial-gradient(circle,rgba(255,244,214,.16),transparent 70%);opacity:.8}
/* Hero */
.hero-glow{position:absolute;width:42vw;height:42vw;right:-7vw;top:-9vw;border-radius:50%;background:radial-gradient(circle,rgba(34,184,207,.22),rgba(244,124,92,.14),rgba(251,191,36,.08),transparent 68%);filter:blur(10px);animation:glow 4.8s ease-in-out infinite}
.orbit{position:absolute;right:4vw;top:12vh;width:38vw;height:38vw;border:1px solid rgba(34,211,238,.2);border-radius:50%;animation:orbit 26s linear infinite}.orbit:before,.orbit:after{content:"";position:absolute;inset:10%;border:1px dashed rgba(249,115,22,.22);border-radius:50%}.orbit:after{inset:24%;border-color:rgba(22,163,74,.18)}

/* diagrams */
.diagram{width:100%;height:auto;display:block}.node{fill:#fff;stroke:#0F766E;stroke-width:3}.node.good{fill:#EEF8F0;stroke:#15803D}.node.bad{fill:#FFF1F0;stroke:#DC2626}.edge{stroke:#93AAA3;stroke-width:3;fill:none}.edge.bad{stroke:#DC2626;stroke-dasharray:8 8}.edge.good{stroke:#15803D}.label{fill:#405C58;font:800 14px Inter,system-ui}.dark .label{fill:#d8e5f2}

/* code */
.code{background:#12333D;border-radius:24px;overflow:hidden;border:1px solid rgba(34,211,238,.15);box-shadow:0 24px 70px rgba(7,21,36,.20)}.codebar{display:flex;gap:7px;align-items:center;padding:11px 14px;background:#1D4652;border-bottom:1px solid rgba(148,163,184,.15)}.cdot{width:10px;height:10px;border-radius:50%}.r{background:#FB7185}.y{background:#FBBF24}.g{background:#4ADE80}.fname{margin-left:8px;color:#9BB3AA;font-size:12px;font-weight:800;font-family:"JetBrains Mono","Cascadia Code",monospace}.code pre{margin:0;padding:20px 22px;color:#E8F0EC;font:14px/1.68 "JetBrains Mono","Cascadia Code","Courier New",monospace;counter-reset:ln;white-space:pre-wrap}.ln{display:block;counter-increment:ln}.ln:before{content:counter(ln);display:inline-block;width:28px;margin-right:18px;color:#627773;text-align:right}.kw{color:#67B7FF}.fn{color:#67E8F9}.str{color:#86EFAC}.num{color:#FBBF24}.cm{color:#7890a8}.op{color:#fda4af}

/* cards / bars */
.step{position:relative;padding:22px;border-radius:22px;background:#FFF7EA;border:1px solid var(--line);transition:transform .4s ease,box-shadow .4s ease}.step:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(15,49,79,.10)}.step .num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#E2F4EF;color:#0e7490;font-weight:900;margin-bottom:14px}.step p{font-size:15px}.dark .step{background:rgba(255,255,255,.06);border-color:rgba(164,188,215,.17)}.dark .step .num{background:rgba(34,211,238,.1);color:#a5f3fc}
.metric{padding:22px;border-radius:22px;background:#FFF7EA;border:1px solid var(--line)}.metric .value{font-size:40px;font-weight:950;letter-spacing:-.06em}.metric .label{margin-top:5px;font-size:13px;color:#6b7b8f}
.barline{height:13px;border-radius:999px;background:#E1E8E2;overflow:hidden}.barline i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#14B8A6,#F97316)}

/* chess board */
.board-shell{position:relative;width:min(46vw,590px);margin:auto}.board{position:relative;width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);overflow:hidden;border-radius:22px;border:1px solid rgba(15,32,52,.14);box-shadow:0 28px 70px rgba(17,40,69,.22)}.sq{display:flex;align-items:center;justify-content:center;position:relative}.sq.light{background:#F4E7CF}.sq.dark{background:#285563}.sq.safe{box-shadow:inset 0 0 0 3px rgba(22,163,74,.65)}.sq.attack{background-image:radial-gradient(circle,rgba(220,38,38,.34),transparent 61%);box-shadow:inset 0 0 0 2px rgba(220,38,38,.32)}.sq.try{box-shadow:inset 0 0 0 3px rgba(8,145,178,.55)}

/* persistent 4Q stage */
#queenStage{position:absolute;inset:0;z-index:30;pointer-events:none;display:none}.queen-stage-inner{position:absolute;right:6.5vw;top:18.5vh;width:min(40vw,520px);height:min(40vw,520px)}#queenStage.on{display:block}.stage-board{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);border-radius:26px;overflow:hidden;border:1px solid rgba(13,45,71,.14);box-shadow:0 30px 90px rgba(17,40,69,.24);background:#285563}.dsq.light{background:#F4E7CF}.dsq.dark{background:#285563}
.qpiece{position:absolute;left:0;top:0;width:25%;height:25%;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:clamp(48px,5.2vw,78px);color:#111827;text-shadow:0 3px 0 rgba(255,255,255,.20),0 7px 18px rgba(0,0,0,.34),0 0 20px rgba(20,184,166,.32);transition:transform 1.55s cubic-bezier(.16,.84,.18,1),opacity .72s ease}.qpiece.back{color:#111827;text-shadow:0 3px 0 rgba(255,255,255,.16),0 7px 18px rgba(0,0,0,.38),0 0 20px rgba(244,124,92,.28)}
.qhalo{position:absolute;inset:-6%;border:2px solid rgba(34,211,238,.18);border-radius:30px;animation:pulseBorder 3.2s ease-in-out infinite}.qscan{position:absolute;left:2%;right:2%;top:6%;height:2px;background:linear-gradient(90deg,transparent,#14B8A6,transparent);filter:blur(.2px);animation:scan 4.5s ease-in-out infinite}.qbadge{position:absolute;left:0;bottom:-54px;padding:9px 13px;border-radius:12px;background:rgba(15,30,51,.92);border:1px solid rgba(34,211,238,.28);color:#dffaff;font-size:12px;font-weight:900;letter-spacing:.08em;box-shadow:0 14px 35px rgba(4,18,33,.2)}.qstatus{position:absolute;right:0;bottom:-54px;padding:9px 13px;border-radius:12px;background:#fff;border:1px solid #dbe5ef;color:#43556d;font-size:12px;font-weight:900;box-shadow:0 14px 35px rgba(17,40,69,.1)}.dark + #queenStage .qstatus{background:#10233b;color:#d9e6f1;border-color:rgba(164,188,215,.2)}
.move-path{position:absolute;inset:-10%;overflow:visible}.move-path path{fill:none;stroke:#14B8A6;stroke-width:4;stroke-linecap:round;stroke-dasharray:12 10;filter:drop-shadow(0 0 7px rgba(34,211,238,.22));opacity:0}.move-path path.play{animation:moveLine 1.55s ease both}.move-arrow{fill:#14B8A6;opacity:0}.move-arrow.play{animation:arrowIn 1.2s ease 0.4s both}@keyframes moveLine{0%{opacity:0;stroke-dashoffset:130}15%{opacity:.9}100%{opacity:0;stroke-dashoffset:-130}}@keyframes arrowIn{from{opacity:0}to{opacity:.95}}

/* fixed footer */
.controls{position:absolute;left:22px;right:22px;bottom:16px;z-index:80;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.ctrlgrp{display:flex;align-items:center;gap:8px;pointer-events:auto}.control{width:38px;height:38px;border:1px solid #D6DFD8;background:rgba(255,255,255,.88);border-radius:12px;color:#234744;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(10px);box-shadow:0 8px 24px rgba(28,49,73,.08)}.control:hover{transform:translateY(-1px);border-color:#79B7AE}.progress{width:210px;height:5px;border-radius:999px;background:#DCE5DE;overflow:hidden}.progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,#14B8A6,#F97316);transition:width .6s ease}.counter{font-size:12px;font-weight:900;color:#6d7f93}

/* full width layouts */
.section-word{font-size:clamp(80px,13vw,180px);font-weight:950;letter-spacing:-.09em;line-height:.8}.section-sub{font-size:20px;max-width:760px;margin-top:20px}.dark .section-sub{color:#d1ddea}
.maze{border-radius:28px;background:#FFF7EA;border:1px solid var(--line);padding:20px;box-shadow:var(--shadow)}
.maze svg,.state-svg,.flow-svg,.sudoku-svg{width:100%;height:auto;display:block}
.table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;border:1px solid var(--line);border-radius:20px;background:#fff}.table th,.table td{padding:14px 16px;border-bottom:1px solid var(--line);font-size:14px;text-align:left}.table th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#687b91;background:#F6F3EA}.table tr:last-child td{border-bottom:0}
.timeline{display:grid;gap:12px}.tl{display:grid;grid-template-columns:92px 1fr;gap:18px;align-items:start}.tl .t{font:900 13px "JetBrains Mono",monospace;color:#0e7490}.tl .box{padding:16px 18px;border:1px solid var(--line);background:#fff;border-radius:16px}

/* responsive */
@media(max-width:1050px){.slide{padding:34px 38px 62px}.grid2{grid-template-columns:1fr}.board-shell{width:min(66vw,520px)}#queenStage .queen-stage-inner{right:3.5vw;top:26vh;width:min(49vw,460px);height:min(49vw,460px)}}
@media(max-width:720px){.slide{padding:24px 20px 58px}h1{font-size:46px}h2{font-size:34px}.grid3,.grid4{grid-template-columns:1fr 1fr}.panel{padding:18px}.big-num{display:none!important}.controls{left:10px;right:10px}.progress{width:100px}#queenStage{display:none!important}.grid3,.grid4{grid-template-columns:1fr}.slide{overflow:auto}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>

<!-- Persistent animated 4-Queens stage. It NEVER rebuilds the queen DOM between slides. -->
<div id="queenStage">
  <div class="queen-stage-inner" id="queenStageInner">
    <div class="qhalo"></div>
    <div class="stage-board" id="qBoard"></div>
    <svg class="move-path" id="moveSvg" viewBox="0 0 100 100" preserveAspectRatio="none"><path id="movePath" d="M10,10 C28,3 55,3 90,15"></path><path id="movePath2" d="M90,15 C72,37 38,45 10,72"></path></svg>
    <div class="qscan"></div>
    <div class="qbadge" id="qBadge">4-QUEENS · BÀN CỜ TRỰC QUAN</div>
    <div class="qstatus" id="qStatus">BÀN CỜ TRỐNG</div>
  </div>
</div>

<div class="controls">
  <div class="ctrlgrp"><button class="control" id="prev">←</button><button class="control" id="next">→</button><button class="control" id="full">⛶</button></div>
  <div class="ctrlgrp"><div class="progress"><i id="bar"></i></div></div>
</div>

<script>
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const boardSVG=(n=4,queens=[],opts={})=>{
  const size=400, cell=size/n;
  let out=`<svg class="diagram" viewBox="0 0 ${size} ${size}"><defs><filter id="glowQ"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    let cls=(r+c)%2?'#456B66':'#eef5fa';
    let extra='';
    if(opts.attack?.some(([rr,cc])=>rr===r&&cc===c)) extra=`<rect x="${c*cell}" y="${r*cell}" width="${cell}" height="${cell}" fill="rgba(220,38,38,.17)"/><text x="${c*cell+cell/2}" y="${r*cell+cell*.64}" text-anchor="middle" font-size="30" fill="#DC2626" opacity=".75">×</text>`;
    if(opts.safe?.some(([rr,cc])=>rr===r&&cc===c)) extra=`<rect x="${c*cell+5}" y="${r*cell+5}" width="${cell-10}" height="${cell-10}" rx="10" fill="none" stroke="#15803D" stroke-width="4"/>`;
    out+=`<rect x="${c*cell}" y="${r*cell}" width="${cell}" height="${cell}" fill="${cls}"/>${extra}`;
  }
  for(const [r,c] of queens){
    out+=`<text x="${c*cell+cell/2}" y="${r*cell+cell*.68}" text-anchor="middle" font-size="${cell*.62}" fill="#111827" filter="url(#glowQ)">♛</text>`;
  }
  out+='</svg>'; return out;
};

const sections=[];
function add(o){sections.push(o)}
function base(o){return Object.assign({variant:'soft'},o)}
function header(k,t,n,extra=''){return `<div class="big-num">${String(n).padStart(2,'0')}</div><div class="header"><div><div class="kicker">${k}</div><h2>${t}</h2></div><div class="right">${extra}</div></div>`}
function cards(items,cols=3){return `<div class="grid${cols}" style="margin-top:28px">${items.map((x,i)=>`<div class="panel" style="animation:rise .7s ease ${i*70}ms both"><div class="kicker">${x.k||''}</div><div class="card-title">${x.t}</div><div class="card-body">${x.b}</div></div>`).join('')}</div>`}
function codeBlock(name,lines){return `<div class="code"><div class="codebar"><span class="cdot r"></span><span class="cdot y"></span><span class="cdot g"></span><span class="fname">${name}</span></div><pre>${lines.map(s=>`<span class="ln">${s}</span>`).join('')}</pre></div>`}

// 01–02 intro
add(base({variant:'dark',html:`<div class="hero-glow"></div><div class="orbit"></div><div style="position:relative;z-index:4;margin-top:12vh;max-width:790px"><div class="pill"><span class="dot"></span> CẤU TRÚC DỮ LIỆU & GIẢI THUẬT</div><div class="kicker" style="margin-top:28px">THUẬT TOÁN</div><h1>BACKTRACKING<br><span style="color:#67E8F9">(QUAY LUI)</span></h1><p style="max-width:670px;margin-top:24px;font-size:21px">Thử một cách → Đi tiếp → Thấy không ổn → Quay lại chỗ vừa rẽ.</p><div style="margin-top:30px;display:flex;flex-wrap:wrap;gap:10px"><span class="pill">Nhóm: 4</span></div></div><div style="position:absolute;right:7vw;top:23vh;width:min(35vw,480px)">${treeGraphic(true)}</div>`}));
add(base({variant:'blue',html:`${header('Mở đầu','Một bài toán — chia thành nhiều quyết định nhỏ',2,'01 → 08')}<div class="grid2" style="margin-top:45px"><div><div class="panel"><div class="kicker">Ý tưởng dẫn đường</div><h3>Mình không cần đoán luôn cả đáp án ngay từ đầu.</h3><p style="margin-top:12px">Mình xây lời giải từng bước. Mỗi bước có vài lựa chọn, và lựa chọn nào sai thì loại luôn.</p></div><div class="note">8 phần: Bài toán → Ý tưởng → 4-Queens → Python → Trực quan → Thời gian → Không gian → Sudoku.</div></div><div class="panel">${flowGraphic()}</div></div>`}));

// 03–09 problem
add(base({variant:'soft',html:`${header('Phần 1 · Bài toán','Backtracking là gì?',3)}<div class="grid2" style="margin-top:35px"><div><div class="panel" style="font-size:25px;line-height:1.35"><b class="accent">Backtracking</b> là kỹ thuật duyệt / tìm kiếm trên <b>không gian trạng thái</b>, xây lời giải từng bước và quay lui khi trạng thái không còn khả năng hợp lệ.</div><div class="note">Cách làm này thường đi cùng <b>đệ quy, kiểm tra ràng buộc và gỡ lựa chọn cũ</b>.</div></div><div class="panel">${treeGraphic(false)}</div></div>`}));

// Render slides
const deck=document.getElementById('deck');
sections.forEach((s,i)=>{const sec=document.createElement('section');sec.className=`slide ${s.variant||'soft'}${i===0?' active':''}`;sec.dataset.index=i+1;sec.innerHTML=s.html;deck.appendChild(sec)});
const slides=[...document.querySelectorAll('.slide')];
const total=slides.length;
// Fix total display to actual count
let idx=0;

// Persistent board
const queenStage=document.getElementById('queenStage');
const qBoard=document.getElementById('qBoard');
for(let r=0;r<4;r++)for(let c=0;c<4;c++){const d=document.createElement('div');d.className=`dsq ${((r+c)%2===0)?'light':'dark'}`;qBoard.appendChild(d)}
const qpieces=[];for(let r=0;r<4;r++){const q=document.createElement('div');q.className='qpiece';q.dataset.row=r;q.textContent='♛';q.style.opacity='0';q.style.transform=`translate(${0}px,${r*25}%)`;qBoard.appendChild(q);qpieces.push(q)}
let currentQ=-1;
function applyQueenState(si,instant=false){
 const s=qStates[si]; if(!s)return;
 const old=qStates[currentQ]?.q||[]; const nextMap=new Map(s.q.map(x=>[x[0],x[1]])); const oldMap=new Map(old.map(x=>[x[0],x[1]]));
 qpieces.forEach((q,r)=>{
   const c=nextMap.get(r); q.classList.toggle('back',si===4||si===7); q.style.opacity=c==null?'0':'1';
   const px=(c==null?(oldMap.get(r)??0):c)*100; q.style.transform=`translate(${px}%,${r*100}%)`;
   if(instant)q.style.transition='none'; else q.style.transition='transform 1.55s cubic-bezier(.16,.84,.18,1),opacity .72s ease';
 });
 if(instant) requestAnimationFrame(()=>qpieces.forEach(q=>q.style.transition='transform 1.55s cubic-bezier(.16,.84,.18,1),opacity .72s ease'));
 document.getElementById('qStatus').textContent=s.status; document.getElementById('qBadge').textContent=s.badge;
 // Animate attacked cells subtly
 [...qBoard.children].forEach((el,i)=>{if(!el.classList.contains('dsq'))return;el.style.boxShadow='';});
 s.attack.forEach(([r,c])=>{qBoard.children[r*4+c].style.boxShadow='inset 0 0 0 2px rgba(220,38,38,.28), inset 0 0 30px rgba(220,38,38,.12)'});
 // Move path from previous known point to first changed row (approximate board coords)
 if(currentQ>=0 && si!==currentQ){const changed=s.q.find(([r,c])=>oldMap.get(r)!==c) || old.find(([r,c])=>!nextMap.has(r)); if(changed){const [r,c]=changed; const oc=oldMap.get(r)??c; const x1=12+oc*25,y1=12+r*25,x2=12+c*25,y2=12+r*25;const path=document.getElementById('movePath');path.setAttribute('d',`M${x1},${y1} C${(x1+x2)/2},${y1-8} ${(x1+x2)/2},${y2+8} ${x2},${y2}`);path.classList.remove('play');void path.offsetWidth;path.classList.add('play')}}
 currentQ=si;
}
function showQueen(on){queenStage.classList.toggle('on',on)}

function animateSlide(s){
 [...s.querySelectorAll('.panel,.step,.metric,.kicker,h1,h2,h3,p,.code,.maze,.table,.timeline')].forEach((el,i)=>{el.style.animation='none';void el.offsetWidth;el.style.animation=`rise .72s cubic-bezier(.2,.8,.2,1) ${Math.min(i*45,360)}ms both`});
}
function update(){
 slides.forEach((s,i)=>s.classList.toggle('active',i===idx));
 document.getElementById('bar').style.width=`${((idx+1)/total)*100}%`;
 const q=slides[idx]?.dataset.q;
 if(q!==undefined){showQueen(true);applyQueenState(Number(q));}
 else showQueen(false);
 animateSlide(slides[idx]);
}
function next(){if(idx<total-1){idx++;update()}}
function prev(){if(idx>0){idx--;update()}}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;
document.getElementById('full').onclick=async()=>{if(!document.fullscreenElement)await document.documentElement.requestFullscreen?.();else await document.exitFullscreen?.()}
window.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();next()}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();prev()}else if(e.key.toLowerCase()==='f'){document.getElementById('full').click()}else if(e.key==='Home'){idx=0;update()}else if(e.key==='End'){idx=total-1;update()}});

// Add dataset q after DOM creation because qSlides are generated by data property
sections.forEach((s,i)=>{if(s.q!==undefined)slides[i].dataset.q=s.q});
// ambient 8-Queens movement
setInterval(()=>{const hero=document.querySelectorAll('#hero8 .sq span');hero.forEach((q,i)=>{q.style.transform=`translateY(${i%2?-3:2}px)`});setTimeout(()=>hero.forEach(q=>q.style.transform='translateY(0)'),900)},2400);
update();
</script>
